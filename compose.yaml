# Pilot default: portable CPU detector. Multi-camera workloads need a verified
# detector/decoder configuration matched to the deployment's actual hardware.
name: ${COMPOSE_PROJECT_NAME:-home-nvr}

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  context:
    build: ./services/context
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    logging: *logging
    environment:
      FRIGATE_URL: http://frigate:5000
      CAMERA_ALIASES_FILE: /app/config/camera-aliases.json
      CONTEXT_API_KEY_FILE: /run/secrets/context_api_key
    secrets: [context_api_key]
    volumes:
      - ./config/camera-aliases.json:/app/config/camera-aliases.json:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    ports:
      - "127.0.0.1:${CONTEXT_HTTP_PORT:-8090}:8090"

  chat-gateway:
    profiles: [ai]
    build: ./services/gateway
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    logging: *logging
    env_file:
      - path: ./config/ai.env
        format: raw
    environment:
      OLLAMA_URL: http://ollama:11434
      CAMERA_ALIASES_FILE: /app/config/camera-aliases.json
      GATEWAY_CONTEXT_TOKENS: "8192"
      GATEWAY_OUTPUT_TOKENS: "1024"
    volumes:
      - ./config/camera-aliases.json:/app/config/camera-aliases.json:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    expose: ["8081"]

  ollama:
    profiles: [ai]
    build:
      context: ./services/ollama
      args:
        OLLAMA_BASE_IMAGE: ${OLLAMA_IMAGE:-ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429}
    image: ${OLLAMA_SECURITY_IMAGE:-home-nvr-ollama:0.40.13-security.1}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    logging: *logging
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "2m"
      OLLAMA_NO_CLOUD: "true"
    volumes:
      - ollama_data:/root/.ollama
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    expose: ["11434"]

  frigate:
    build:
      context: ./services/frigate
      args:
        FRIGATE_BASE_IMAGE: ${FRIGATE_IMAGE:-ghcr.io/blakeblackshear/frigate:0.18.2@sha256:fd60f99ffd4eb6c42360ed4e14953e270586f239309ab3983e55b2e97ffac09a}
    image: ${FRIGATE_SECURITY_IMAGE:-home-nvr-frigate:0.18.2-security.1}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    pids_limit: 2048
    stop_grace_period: 60s
    shm_size: ${FRIGATE_SHM_SIZE:-512mb}
    logging: *logging
    volumes:
      # Keep SQLite on Docker-managed Linux storage, including on Windows/WSL.
      - frigate_config:/config
      - ./config/frigate.yml:/config/config.yml:ro
      - ${FRIGATE_MEDIA_PATH:-./data/media}:/media/frigate
    tmpfs:
      - /tmp/cache:size=1g
    # Raw env preserves literal dollar signs and quotes in camera credentials.
    # Requires Docker Compose 2.30+. bootstrap creates this private file.
    env_file:
      - path: ./secrets/camera-secrets.env
        format: raw
    ports:
      - "127.0.0.1:${FRIGATE_HTTP_PORT:-18971}:8971"

  # Enable only with inventory mqtt.enabled: true AND --profile mqtt.
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    profiles: [mqtt]
    user: "1883:1883"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    logging: *logging
    volumes:
      - ./mqtt/config:/mosquitto/config:ro
      - mqtt_data:/mosquitto/data
    tmpfs:
      - /tmp:size=16m
    # No host listener; clients on this Compose network authenticate.
    expose: ["1883"]

volumes:
  frigate_config:
  mqtt_data:
  ollama_data:

secrets:
  context_api_key:
    file: ./secrets/context_api_key
