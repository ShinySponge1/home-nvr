# Replace the reserved example.invalid addresses in your PRIVATE inventory.
# Environment credential values must be percent-encoded for use in an RTSP URL.
version: 1
retention_days: 2
mqtt:
  enabled: false
cameras:
  - id: entrance
    name: Main entrance
    aliases: [front door, entry]
    record_url: "rtsp://{FRIGATE_ENTRANCE_USER}:{FRIGATE_ENTRANCE_PASSWORD}@camera.example.invalid:554/main"
    detect_url: "rtsp://{FRIGATE_ENTRANCE_USER}:{FRIGATE_ENTRANCE_PASSWORD}@camera.example.invalid:554/sub"
    detect:
      width: 640
      height: 360
      fps: 5
    # Turn on only when the selected detection source contains audio.
    audio: false
    # Enable if recording audio is wanted; Frigate converts it to AAC.
    record_audio: false
