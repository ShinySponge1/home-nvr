version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /services/context
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/gateway
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/frigate
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/ollama
    schedule:
      interval: weekly
