name: regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-bootstrap.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s services/context/tests -v
      - run: python -m unittest discover -s services/gateway -p 'test_*.py' -v
      - run: node --check services/context/static/app.js
      - run: python scripts/check_public_tree.py
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag home-nvr-context:ci services/context
      - run: docker build --tag home-nvr-gateway:ci services/gateway
